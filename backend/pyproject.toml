[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open-source-accounting-api"
version = "0.7.0"
description = "Evidence-first accounting research: free chat and annual paid agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.12,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.40,<2.1", "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
  "google-auth[requests]>=2.39,<3", "google-cloud-storage>=3,<4",
  "firebase-admin>=7,<8", "pypdf>=6,<7",
  "python-docx>=1.1,<2", "reportlab>=4.3,<5", "python-dateutil>=2.9,<3",
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
app = ["agents/*.json", "asu_data/*.json"]
