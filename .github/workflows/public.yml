name: Public client and content
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python3 scripts/check_public.py
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run test:auth
      - run: npm --prefix frontend run test:systems
      - run: npm --prefix frontend run build
      - run: python3 scripts/check_public.py --dist
