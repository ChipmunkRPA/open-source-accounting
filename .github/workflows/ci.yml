name: application-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: osa_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: osa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U osa_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv==0.10.9
      - run: uv sync --project backend --extra dev --frozen --python '${{ matrix.python-version }}'
      - name: Build real identity assets before API tests
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run typecheck && npm run test:auth && npm run build
      - name: Backend regression tests
        working-directory: backend
        run: .venv/bin/python -m pytest --junitxml=../reports/ci-backend.xml
      - name: Empty PostgreSQL migration round trip and schema parity
        env:
          OSA_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://osa_test:local_ci_only@localhost:5432/osa_test
        run: backend/.venv/bin/python scripts/check_migrations.py
      - name: PostgreSQL intake and rights concurrency contracts
        working-directory: backend
        env:
          OSA_POSTGRES_TEST_URL: postgresql+psycopg://osa_test:local_ci_only@localhost:5432/osa_test
          OSA_DISPOSABLE_TEST_DATABASE: 'true'
        run: .venv/bin/python -m pytest tests/test_intake_postgres.py --junitxml=../reports/ci-postgres.xml
      - name: Contracts, content, queue and publication checks
        run: |
          backend/.venv/bin/python scripts/export_contracts.py
          git diff --exit-code -- docs/openapi.json docs/analysis.schema.json docs/research-plan.schema.json
          backend/.venv/bin/python scripts/check_content.py
          backend/.venv/bin/python scripts/check_queue.py
          backend/.venv/bin/python scripts/content_progress.py --check
          backend/.venv/bin/python scripts/sec_core_progress.py --check
          backend/.venv/bin/python scripts/release_preflight.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-python-${{ matrix.python-version }}
          path: reports/ci-*.xml
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t osa-ci .
