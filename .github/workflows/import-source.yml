name: Import reviewed source snapshot
on:
  push:
    branches: [main]
    paths: ['.release/import.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: initial-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'ChipmunkRPA/open-source-accounting'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify and expand source snapshot
        run: python3 .release/import_source.py
      - name: Screen publication contents
        run: python3 scripts/release_preflight.py --check
      - name: Commit readable source without overwriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish open-source-accounting v0.6 source, MFA, and content pack'
          git push origin HEAD:main
