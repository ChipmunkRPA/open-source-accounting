name: Materialize reviewed source release
on:
  push:
    branches: [main]
    paths: ['.release/ready.json']
permissions:
  contents: write
concurrency:
  group: source-materialization
  cancel-in-progress: false
jobs:
  publish-source:
    if: github.repository == 'ChipmunkRPA/open-source-accounting'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and materialize native source
        run: python scripts/materialize_release.py
      - name: Commit native source without overwriting concurrent work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish v0.6.0 application, mandatory MFA, and expanded content library'
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean backend installation and tests
        run: |
          python -m pip install -e './backend[dev]'
          cd backend
          python -m pytest
      - name: Clean frontend vendor build and MFA tests
        run: |
          cd frontend
          npm install
          npm run typecheck
          npm run build
          npm run test:auth
      - name: Content, progress and publication checks
        run: |
          python scripts/check_content.py
          python scripts/content_progress.py
          python scripts/release_preflight.py --check
